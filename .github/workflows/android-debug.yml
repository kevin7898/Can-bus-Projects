name: Android debug APK

on:
  push:
    branches: [main]
    paths:
      - "jetta-recorder-android/**"
      - ".github/workflows/android-debug.yml"
  pull_request:
    paths:
      - "jetta-recorder-android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jetta-recorder-android

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and assemble debug APK
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Verify Kotlin tests ran and launcher classes are packaged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          count = sum(int(ET.parse(report).getroot().attrib["tests"]) for report in reports)
          assert count > 0, "No unit tests executed; check the Kotlin Android plugin"
          print(f"Verified {count} unit tests executed")
          PY
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only \
            app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/jetta-dex.txt"
          for activity in BootstrapActivity MainActivity; do
            grep -E "^C[[:space:]].*[[:space:]]ca\.jettatelemetry\.app\.${activity}$" "$RUNNER_TEMP/jetta-dex.txt"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jetta-recorder-debug
          path: jetta-recorder-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
