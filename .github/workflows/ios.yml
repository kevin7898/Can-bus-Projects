name: iOS companion
on:
  push:
    branches: [main, 'codex/ios-companion*']
    paths: ['can-connect-ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['can-connect-ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select available iPhone simulator
        run: |
          xcodebuild -version
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if "iPhone" in v["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test native app
        working-directory: can-connect-ios
        run: |
          set -o pipefail
          xcodebuild test -project CANConnect.xcodeproj -scheme CANConnect -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
      - name: Export native screenshots
        if: always()
        working-directory: can-connect-ios
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments || true
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: |
            can-connect-ios/TestResults.xcresult
            can-connect-ios/xcodebuild.log
            can-connect-ios/TestAttachments
          retention-days: 14
