name: iOS companion
on:
  push:
    branches: [main]
    paths: ['can-connect-ios/**', 'branding/driveline/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['can-connect-ios/**', 'branding/driveline/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select available iPhone simulator
        run: |
          xcodebuild -version
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin)["devices"]; runtimes=sorted((k for k in d if ".iOS-" in k),key=lambda k:tuple(map(int,re.findall(r"\d+",k))),reverse=True); phones=next([v for v in d[k] if "iPhone" in v["name"]] for k in runtimes if any("iPhone" in v["name"] for v in d[k])); print(next((v["udid"] for v in phones if v["name"].endswith(" Pro")),phones[0]["udid"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build and test native app
        working-directory: can-connect-ios
        run: |
          set -o pipefail
          xcodebuild test -parallel-testing-enabled NO -project CANConnect.xcodeproj -scheme CANConnect -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
      - name: Export native screenshots
        if: always() && !cancelled()
        working-directory: can-connect-ios
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments || true
      - name: Preserve test evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: |
            can-connect-ios/TestResults.xcresult
            can-connect-ios/xcodebuild.log
            can-connect-ios/TestAttachments
          retention-days: 14
