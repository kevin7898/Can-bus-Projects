<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAN / CONNECT</title><style>
*{box-sizing:border-box}body{margin:0;background:#09121d;color:#e4f1ff;font:13px system-ui}header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:#101e2c;border-bottom:1px solid #30465c;gap:10px;flex-wrap:wrap}h1{font-size:19px;letter-spacing:2px;margin:0}h1 b{color:#5cb9ff}button{background:#1a344c;border:1px solid #40617e;color:#e3f2ff;padding:8px 12px;border-radius:7px;cursor:pointer}button.primary{background:#176399}.layout{display:grid;grid-template-columns:180px 1fr}nav{background:#0e1a27;min-height:95vh;padding:16px;border-right:1px solid #30465c}nav div{padding:11px;color:#93aec5}nav .active{background:#1b405e;color:#b8e2ff;border-radius:6px}main{padding:20px;min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.heading h2{margin:0}.gridwrap{overflow-x:auto}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:48px;gap:8px;min-width:640px}.widget{background:#152738;border:1px solid #304c63;border-radius:9px;min-width:0;overflow:hidden;position:relative;display:flex;flex-direction:column}.widget.edit{border:1px dashed #68baff}.title{height:34px;min-height:34px;padding:8px 10px;color:#a7c2d7;display:flex;align-items:center;justify-content:space-between;gap:4px;font-weight:700;font-size:11px}.title span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.body{padding:5px 10px;flex:1;min-height:0}.value{font-size:clamp(18px,2.4vw,31px);font-weight:750}.muted{font-size:11px;color:#8ca8bd}.grip,.resize,.widget-actions{display:none}.edit .grip{display:block;cursor:grab;touch-action:none;background:#28506e;padding:4px 7px;border-radius:5px}.edit .resize{display:block;position:absolute;bottom:0;right:0;width:24px;height:24px;touch-action:none;cursor:nwse-resize;background:linear-gradient(135deg,transparent 55%,#67baff 56%,#67baff 62%,transparent 63%)}.edit .widget-actions{display:flex;gap:3px}.widget-actions button{padding:2px 5px}.map{height:100%;min-height:60px;background:radial-gradient(ellipse,#23455e,#10202e);position:relative}.map svg{width:100%;height:100%}.map small{position:absolute;bottom:8px;left:8px;color:#a6cce5}.drawer{position:fixed;right:0;top:0;bottom:0;background:#112235;border-left:1px solid #4d7291;width:min(340px,90vw);padding:20px;z-index:4;overflow:auto;box-shadow:-12px 0 40px #0008}.drawer[hidden],[hidden]{display:none!important}.drawer button{margin:4px}.hint{margin-top:15px;color:#8ba8be}@media(max-width:800px){.layout{display:block}nav{display:none}main{padding:12px}}
</style><header><div><h1>CAN <b>/</b> CONNECT</h1><div class="muted">VEHICLE INTELLIGENCE · LAYOUT STUDIO</div></div><div><button id="add" hidden>+ Widget</button> <button id="custom" class="primary">Customize</button> <button id="save" class="primary" hidden>Save</button> <button id="cancel" hidden>Cancel</button></div></header><div class="layout"><nav><div class="active">▦ Overview</div><div>⌁ Trips</div><div>▤ Telemetry</div><div>⚙ Diagnostics</div><div>▧ CAN Explorer</div><div>▣ Vehicles</div></nav><main><div class="heading"><div><h2>Overview</h2><div class="muted">2014 JETTA TDI · DEMO TELEMETRY</div></div><div class="muted">● OFFLINE</div></div><div class="gridwrap"><div id="grid" class="grid"></div></div><p class="hint" id="hint">Customize to drag, resize, add and duplicate widgets. Layout is stored in this browser.</p></main></div><div id="drawer" class="drawer" hidden><button id="close">Close</button><h2>Widget library</h2><div id="catalog"></div></div><script>
const types={map:['Driving heatmap',8,5],fuel:['Fuel economy',4,2],range:['Estimated range',4,3],distance:['Distance',3,2],dpf:['DPF status',3,2],trips:['Trips',3,2],engine:['Engine health',3,2],trend:['Economy trend',7,3],activity:['Recent activity',5,3]};
const base=[['map',0,0],['fuel',8,0],['range',8,2],['distance',0,5],['dpf',3,5],['trips',6,5],['engine',9,5],['trend',0,7],['activity',7,7]].map(([type,x,y],i)=>({id:'w'+i,type,x,y,w:types[type][1],h:types[type][2]}));
const $=x=>document.querySelector(x);let saved;try{saved=JSON.parse(localStorage.getItem('can-connect-layout'))||base}catch{saved=base}let widgets=JSON.parse(JSON.stringify(saved)),edit=false,drag=null,serial=Date.now();
const collide=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function content(t){if(t==='map')return '<div class="map"><svg viewBox="0 0 400 170" preserveAspectRatio="none"><path d="M0 25L400 130M20 160L370 15M120 0L200 170M300 0L360 170" fill="none" stroke="#395b72" stroke-width="4"/><path d="M0 135Q75 80 120 100T230 70T400 25" stroke="#51baff" stroke-width="5" fill="none"/><path d="M0 150Q100 120 170 130T400 80" stroke="#247fc0" stroke-width="3" fill="none"/></svg><small>Illustrative route heatmap</small></div>';if(t==='trend')return '<svg viewBox="0 0 280 75" preserveAspectRatio="none" style="width:100%;height:90%"><path d="M0 18L30 30L60 16L90 42L120 34L150 52L190 38L220 60L250 48L280 58" stroke="#69bfff" stroke-width="3" fill="none"/></svg>';if(t==='activity')return '<div class="muted" style="line-height:2">↗ Highway drive · 126 km<br>↗ Morning commute · 39 km<br>↗ Evening drive · 42 km</div>';const v={fuel:['5.3','L/100 km'],range:['635 km','Remaining'],distance:['1,842','km this month'],dpf:['12.4 g','Soot estimate'],trips:['46','Recorded'],engine:['NORMAL','Demo status']}[t];return '<div class="value">'+v[0]+'</div><div class="muted">'+v[1]+'</div>'}
function render(){const grid=$('#grid');grid.innerHTML='';for(const w of widgets){const el=document.createElement('section');el.className='widget'+(edit?' edit':'');el.dataset.id=w.id;el.style.gridColumn=(w.x+1)+'/span '+w.w;el.style.gridRow=(w.y+1)+'/span '+w.h;el.innerHTML='<div class="title"><span>'+types[w.type][0].toUpperCase()+'</span><span class="widget-actions"><button data-action="copy">⧉</button><button data-action="remove">×</button></span><span class="grip">⠿</span></div><div class="body">'+content(w.type)+'</div><div class="resize"></div>';grid.append(el)}}
function space(w){for(let y=0;y<100;y++)for(let x=0;x<=12-w.w;x++){let a={...w,x,y};if(!widgets.some(b=>collide(a,b)))return a}return {...w,x:0,y:100}}
function mode(v){edit=v;$('#custom').hidden=v;$('#save').hidden=!v;$('#cancel').hidden=!v;$('#add').hidden=!v;render()}
$('#custom').onclick=()=>mode(true);$('#save').onclick=()=>{saved=JSON.parse(JSON.stringify(widgets));localStorage.setItem('can-connect-layout',JSON.stringify(saved));mode(false)};$('#cancel').onclick=()=>{widgets=JSON.parse(JSON.stringify(saved));mode(false)};$('#add').onclick=()=>$('#drawer').hidden=false;$('#close').onclick=()=>$('#drawer').hidden=true;
for(const [t,d] of Object.entries(types)){let b=document.createElement('button');b.textContent='+ '+d[0];b.onclick=()=>{widgets.push(space({id:'w'+(++serial),type:t,w:d[1],h:d[2]}));render()};$('#catalog').append(b)}
$('#grid').addEventListener('click',e=>{if(!edit)return;const b=e.target.closest('[data-action]');if(!b)return;const w=widgets.find(x=>x.id===b.closest('.widget').dataset.id);if(b.dataset.action==='remove')widgets=widgets.filter(x=>x!==w);else widgets.push(space({...w,id:'w'+(++serial)}));render()});
$('#grid').addEventListener('pointerdown',e=>{if(!edit)return;const handle=e.target.closest('.grip,.resize');if(!handle)return;const el=handle.closest('.widget'),w=widgets.find(x=>x.id===el.dataset.id);drag={id:w.id,mode:handle.classList.contains('resize')?'resize':'move',sx:e.clientX,sy:e.clientY,origin:{...w},el};handle.setPointerCapture(e.pointerId);e.preventDefault()});
$('#grid').addEventListener('pointermove',e=>{if(!drag)return;const d=drag,w=widgets.find(x=>x.id===d.id),g=$('#grid'),cell=(g.clientWidth-88)/12+8,dx=Math.round((e.clientX-d.sx)/cell),dy=Math.round((e.clientY-d.sy)/56),test={...d.origin};if(d.mode==='move'){test.x=Math.max(0,Math.min(12-w.w,test.x+dx));test.y=Math.max(0,test.y+dy)}else{test.w=Math.max(2,Math.min(12-w.x,test.w+dx));test.h=Math.max(2,test.h+dy)}if(widgets.some(v=>v!==w&&collide(v,test)))return;Object.assign(w,test);d.el.style.gridColumn=(w.x+1)+'/span '+w.w;d.el.style.gridRow=(w.y+1)+'/span '+w.h});
function end(){if(drag){drag=null;render()}}$('#grid').addEventListener('pointerup',end);$('#grid').addEventListener('pointercancel',end);render();
</script></html>
